<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - Analytics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2a4e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #0a9fff;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #0a9fff;
            text-shadow: 0 0 10px rgba(10, 159, 255, 0.5);
            margin-bottom: 10px;
        }

        .upload-section {
            background: rgba(10, 159, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #0a9fff;
            text-align: center;
        }

        input[type="file"] {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #0a9fff;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background: #0a9fff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #0080cc;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(10, 159, 255, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0a9fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(10, 159, 255, 0.1);
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #0a9fff;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.9em;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0a9fff;
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        .chart-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #0a9fff;
        }

        .match-history {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0a9fff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }

        .match-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid transparent;
            margin-bottom: 10px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .match-entry:hover {
            background: rgba(10, 159, 255, 0.1);
        }

        .match-entry.win {
            border-left-color: #00d166;
            background: rgba(0, 209, 102, 0.05);
        }

        .match-entry.loss {
            border-left-color: #ff1744;
            background: rgba(255, 23, 68, 0.05);
        }

        .match-champion {
            font-weight: bold;
            color: #0a9fff;
            min-width: 120px;
        }

        .match-kda {
            color: #a0a0a0;
            min-width: 100px;
        }

        .match-result {
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 4px;
            min-width: 80px;
            text-align: center;
        }

        .match-result.win {
            background: rgba(0, 209, 102, 0.3);
            color: #00d166;
        }

        .match-result.loss {
            background: rgba(255, 23, 68, 0.3);
            color: #ff1744;
        }

        .champion-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .champion-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0a9fff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .champion-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #0a9fff;
            margin-bottom: 10px;
        }

        .error {
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid #ff1744;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .success {
            background: rgba(0, 209, 102, 0.1);
            border: 1px solid #00d166;
            color: #69f0ae;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ League of Legends Analytics</h1>
            <p>Suivi détaillé de tes performances</p>
        </header>

        <div class="upload-section">
            <input type="file" id="fileInput" accept=".json" placeholder="Sélectionne lol_stats.json">
            <button onclick="loadFile()">Charger les données</button>
            <button onclick="downloadTemplate()" style="background: #666;">📥 Télécharger template</button>
        </div>

        <div id="messageContainer"></div>

        <div id="statsContainer" style="display: none;">
            <!-- Stats générales -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Matchs</div>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Kills/Deaths/Assists</div>
                    <div class="stat-value" id="kda">0.0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">CS Moyen</div>
                    <div class="stat-value" id="avgCS">0</div>
                </div>
            </div>

            <!-- Graphiques -->
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">📊 Win Rate Evolution</div>
                    <canvas id="wrChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">🎯 Champions (Win Rate)</div>
                    <canvas id="champChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">💀 KDA par Champion</div>
                    <canvas id="kdaChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">🏆 Jeux par Champion</div>
                    <canvas id="gamesChart"></canvas>
                </div>
            </div>

            <!-- Stats par champion -->
            <div class="match-history">
                <h2>👨‍🎮 Statistiques par Champion</h2>
                <div class="champion-stats" id="championStats"></div>
            </div>

            <!-- Historique des matchs -->
            <div class="match-history">
                <h2>📜 Historique des Matchs</h2>
                <div id="matchList"></div>
            </div>
        </div>
    </div>

    <script>
        let chartInstances = {};
        let allData = null;

        function loadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                showMessage('Sélectionne un fichier JSON', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    allData = JSON.parse(e.target.result);
                    renderDashboard();
                    showMessage('✓ Données chargées avec succès!', 'success');
                } catch (error) {
                    showMessage('Erreur: Fichier JSON invalide', 'error');
                }
            };
            reader.readAsText(file);
        }

        function renderDashboard() {
            if (!allData || !allData.matches || allData.matches.length === 0) {
                showMessage('Aucune donnée de match trouvée', 'error');
                return;
            }

            document.getElementById('statsContainer').style.display = 'block';

            updateStats();
            updateCharts();
            updateChampionStats();
            updateMatchHistory();
        }

        function updateStats() {
            const matches = allData.matches;
            const totalGames = matches.length;
            const wins = matches.filter(m => m.win).length;
            const winRate = totalGames > 0 ? (wins / totalGames * 100).toFixed(1) : 0;

            let totalKills = 0, totalDeaths = 0, totalAssists = 0, totalCS = 0;

            matches.forEach(m => {
                totalKills += m.kills;
                totalDeaths += m.deaths;
                totalAssists += m.assists;
                totalCS += m.cs;
            });

            const kda = totalDeaths > 0 ? ((totalKills + totalAssists) / totalDeaths).toFixed(2) : totalKills.toFixed(2);
            const avgCS = (totalCS / totalGames).toFixed(1);

            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('kda').textContent = kda;
            document.getElementById('avgCS').textContent = avgCS;
        }

        function updateCharts() {
            // Win Rate Evolution
            const matches = allData.matches.slice().reverse();
            let cumulativeWins = 0;
            const wrLabels = [];
            const wrData = [];

            matches.forEach((m, idx) => {
                cumulativeWins += m.win ? 1 : 0;
                wrLabels.push(`M${idx + 1}`);
                wrData.push((cumulativeWins / (idx + 1) * 100).toFixed(1));
            });

            createOrUpdateChart('wrChart', {
                type: 'line',
                data: {
                    labels: wrLabels,
                    datasets: [{
                        label: 'Win Rate (%)',
                        data: wrData,
                        borderColor: '#0a9fff',
                        backgroundColor: 'rgba(10, 159, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: true, labels: { color: '#fff' } }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { color: '#a0a0a0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#a0a0a0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });

            // Champion Win Rate
            const champStats = Object.entries(allData.champion_stats);
            const champLabels = champStats.map(([name]) => name).slice(0, 10);
            const champWRs = champStats.map(([_, stats]) =>
                (stats.wins / stats.games * 100).toFixed(1)
            ).slice(0, 10);

            createOrUpdateChart('champChart', {
                type: 'bar',
                data: {
                    labels: champLabels,
                    datasets: [{
                        label: 'Win Rate (%)',
                        data: champWRs,
                        backgroundColor: champWRs.map(wr => wr >= 50 ? '#00d166' : '#ff1744')
                    }]
                },
                options: {
                    responsive: true,
                    indexAxis: 'y',
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { color: '#a0a0a0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        y: {
                            ticks: { color: '#a0a0a0' }
                        }
                    }
                }
            });

            // KDA Chart
            const kdaData = champStats.map(([_, stats]) =>
                stats.deaths > 0 ? ((stats.kills + stats.assists) / stats.deaths).toFixed(2) : stats.kills
            ).slice(0, 10);

            createOrUpdateChart('kdaChart', {
                type: 'bar',
                data: {
                    labels: champLabels,
                    datasets: [{
                        label: 'KDA',
                        data: kdaData,
                        backgroundColor: '#0a9fff'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#a0a0a0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#a0a0a0' }
                        }
                    }
                }
            });

            // Games Count
            const gamesData = champStats.map(([_, stats]) => stats.games).slice(0, 10);

            createOrUpdateChart('gamesChart', {
                type: 'doughnut',
                data: {
                    labels: champLabels,
                    datasets: [{
                        data: gamesData,
                        backgroundColor: [
                            '#0a9fff', '#00d166', '#ff1744', '#ffc400',
                            '#7c4dff', '#00e5ff', '#ff6b6b', '#69f0ae',
                            '#ffa726', '#ef5350'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    }
                }
            });
        }

        function createOrUpdateChart(canvasId, config) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (chartInstances[canvasId]) {
                chartInstances[canvasId].destroy();
            }
            chartInstances[canvasId] = new Chart(ctx, config);
        }

        function updateChampionStats() {
            const champStats = Object.entries(allData.champion_stats)
                .sort((a, b) => b[1].games - a[1].games);

            const html = champStats.map(([champion, stats]) => {
                const wr = (stats.wins / stats.games * 100).toFixed(1);
                const kda = stats.deaths > 0 ? ((stats.kills + stats.assists) / stats.deaths).toFixed(2) : stats.kills;
                const avgCS = (stats.total_cs / stats.games).toFixed(1);

                return `
                    <div class="champion-card">
                        <div class="champion-name">${champion}</div>
                        <p><strong>${stats.games}</strong> jeux | <strong>${wr}%</strong> WR</p>
                        <p>KDA: <strong>${kda}</strong> | CS: <strong>${avgCS}</strong></p>
                        <p style="color: #a0a0a0; font-size: 0.9em;">${stats.wins}W-${stats.losses}L</p>
                    </div>
                `;
            }).join('');

            document.getElementById('championStats').innerHTML = html;
        }

        function updateMatchHistory() {
            const matches = allData.matches.slice().reverse();
            const html = matches.slice(0, 50).map(m => {
                const winClass = m.win ? 'win' : 'loss';
                const winText = m.win ? 'WIN' : 'LOSS';

                return `
                    <div class="match-entry ${winClass}">
                        <div class="match-champion">${m.champion}</div>
                        <div class="match-kda">${m.kills}/${m.deaths}/${m.assists}</div>
                        <div style="color: #a0a0a0;">${m.cs} CS</div>
                        <div class="match-result ${winClass}">${winText}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('matchList').innerHTML = html;
        }

        function showMessage(msg, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}">${msg}</div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        function downloadTemplate() {
            const template = {
                "player_info": {},
                "matches": [],
                "champion_stats": {},
                "daily_summary": []
            };
            const blob = new Blob([JSON.stringify(template, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'lol_stats.json';
            a.click();
        }
    </script>
</body>
</html>
